name: Build My Finance APK
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project only once
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android
          else
            echo "Using the Android project committed in the repository."
          fi
      - name: Apply repository Android configuration
        run: python3 .github/scripts/configure_android.py
      - name: Save generated Android project to repository
        run: |
          if [ -z "$(git ls-files android)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android .gitignore
            git commit -m "Add persistent Android project configuration"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Android project is already tracked; no generated files to commit."
          fi
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          secret_count=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              secret_count=$((secret_count + 1))
            fi
          done

          if [ "$secret_count" -eq 4 ]; then
            echo "Using permanent Android release signing key."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            test -s android/app/upload-keystore.jks
            {
              echo "ANDROID_KEYSTORE_PATH=upload-keystore.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ "$secret_count" -eq 0 ]; then
            echo "No permanent signing secrets configured; creating a temporary test signing key."
            temp_password="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore android/app/temporary-test-signing.jks \
              -storepass "$temp_password" \
              -keypass "$temp_password" \
              -alias myfinance-temporary \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=My Finance Temporary Test, OU=Development, O=My Finance, L=Unknown, ST=Unknown, C=PK"
            {
              echo "ANDROID_KEYSTORE_PATH=temporary-test-signing.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$temp_password"
              echo "ANDROID_KEY_ALIAS=myfinance-temporary"
              echo "ANDROID_KEY_PASSWORD=$temp_password"
            } >> "$GITHUB_ENV"
          else
            echo "Incomplete Android signing secrets: configure all four secrets together, or remove all four for temporary test signing."
            exit 1
          fi
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK with increasing version code
        run: flutter build apk --release --no-tree-shake-icons --build-number "$GITHUB_RUN_NUMBER"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
