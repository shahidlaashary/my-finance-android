name: Build My Finance APK
on:
  workflow_dispatch:
  # Automatic build ko band rakha gaya hai; zaroorat par is block ko uncomment kar sakte hain.
  # push:
  #   branches:
  #     - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create . --platforms=android
      - name: Configure Android biometric activity and permission
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main -name MainActivity.kt -o -name MainActivity.java | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAIN_ACTIVITY"
          fi
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/src/main/res/values/styles.xml ]; then
            sed -i 's#parent="@android:style/Theme.Light.NoTitleBar"#parent="Theme.AppCompat.DayNight"#' android/app/src/main/res/values/styles.xml
          fi
          APP_GRADLE=$(find android/app -maxdepth 1 \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)
          if [ -n "$APP_GRADLE" ]; then
            if [[ "$APP_GRADLE" == *.kts ]]; then
              sed -i '/dependencies {/a\    implementation("androidx.appcompat:appcompat:1.7.0")' "$APP_GRADLE"
            else
              sed -i '/dependencies {/a\    implementation "androidx.appcompat:appcompat:1.7.0"' "$APP_GRADLE"
            fi
          fi
      - name: Diagnostic - skip native plugin registration
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          PACKAGE_LINE=$(grep '^package ' "$MAIN_ACTIVITY")
          printf '%s\nimport io.flutter.embedding.android.FlutterFragmentActivity\nimport io.flutter.embedding.engine.FlutterEngine\n\nclass MainActivity : FlutterFragmentActivity() {\n    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n        // Diagnostic only: intentionally skip automatic plugin registration.\n    }\n}\n' "$PACKAGE_LINE" > "$MAIN_ACTIVITY"
          cat "$MAIN_ACTIVITY"
      - name: Configure Gradle download
        run: |
          sed -i 's#services.gradle.org/distributions/#downloads.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Verify APK package, signature, and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          unzip -t "$APK" | tail -n 1
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Android build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee build/apk-diagnostics.txt
          grep -q "^application:" build/apk-diagnostics.txt
          if ! grep -q "^application-icon-" build/apk-diagnostics.txt; then
            echo "ERROR: APK has no launcher icon resources."
            exit 1
          fi
          echo "APK package, signature, and launcher icon checks passed."

      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/apk-diagnostics.txt
          if-no-files-found: error
