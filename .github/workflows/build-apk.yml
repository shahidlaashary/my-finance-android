name: Build My Finance APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project only once
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android
          else
            echo "Using the Android project committed in the repository."
          fi
      - name: Apply repository Android configuration
        run: python3 .github/scripts/configure_android.py
      - name: Save generated Android project to repository
        run: |
          if [ -z "$(git ls-files android)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android .gitignore
            git commit -m "Add persistent Android project configuration"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Android project is already tracked; no generated files to commit."
          fi
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          secret_count=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              secret_count=$((secret_count + 1))
            fi
          done

          if [ "$secret_count" -eq 4 ]; then
            echo "Using permanent Android release signing key."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            test -s android/app/upload-keystore.jks
            {
              echo "ANDROID_KEYSTORE_PATH=upload-keystore.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ "$secret_count" -eq 0 ]; then
            echo "No permanent signing secrets configured; creating a temporary test signing key."
            temp_password="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore android/app/temporary-test-signing.jks \
              -storepass "$temp_password" \
              -keypass "$temp_password" \
              -alias myfinance-temporary \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=My Finance Temporary Test, OU=Development, O=My Finance, L=Unknown, ST=Unknown, C=PK"
            {
              echo "ANDROID_KEYSTORE_PATH=temporary-test-signing.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$temp_password"
              echo "ANDROID_KEY_ALIAS=myfinance-temporary"
              echo "ANDROID_KEY_PASSWORD=$temp_password"
            } >> "$GITHUB_ENV"
          else
            echo "Incomplete Android signing secrets: configure all four secrets together, or remove all four for temporary test signing."
            exit 1
          fi
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install dependencies
        run: flutter pub get
      - name: Align video_thumbnail Android plugin with host Gradle configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          candidates = list(cache.glob("hosted/pub.dev/video_thumbnail-*/android/build.gradle"))
          candidates += list(cache.glob("hosted/pub.dartlang.org/video_thumbnail-*/android/build.gradle"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one resolved video_thumbnail Gradle file, found {len(candidates)}")

          gradle_file = candidates[0]
          source = gradle_file.read_text()
          source, removed = re.subn(
              r"(?ms)^buildscript\s*\{.*?^\}\s*",
              "",
              source,
              count=1,
          )
          source = re.sub(r"(?im)^\s*jcenter\s*\(\s*\)\s*$", "        mavenCentral()", source)
          source = re.sub(r"(?m)^\s*apply plugin:\s*['\"]com\.android\.library['\"]\s*\n?", "", source)
          source = re.sub(r"(?m)^\s*apply plugin:\s*['\"]kotlin-android['\"]\s*\n?", "", source)
          marker = "apply plugin: 'com.android.library'\napply plugin: 'kotlin-android'\n"
          android_block = re.search(r"(?m)^android\\s*\\{", source)
          if not android_block:
              raise SystemExit(f"Android configuration block missing in {gradle_file}")
          source = source[:android_block.start()] + marker + "\\n" + source[android_block.start():]
          android_block = re.search(r"(?m)^android\\s*\\{", source)
          block_start = android_block.end()
          block_end = source.find("\\n}", block_start)
          if block_end < 0:
              raise SystemExit(f"Could not locate end of Android block in {gradle_file}")
          android_config = source[block_start:block_end]
          if re.search(r"(?m)^\\s*compileSdk(?:Version)?\\s+", android_config):
              android_config = re.sub(r"(?m)^(\\s*)compileSdk(?:Version)?\\s+\\d+", r"\\g<1>compileSdkVersion 35", android_config, count=1)
          else:
              android_config = "\\n    compileSdkVersion 35" + android_config
          source = source[:block_start] + android_config + source[block_end:]
          if "jcenter()" in source or source.count("apply plugin: 'com.android.library'") != 1:
              raise SystemExit(f"Could not normalize video_thumbnail Gradle plugins in {gradle_file}")
          gradle_file.write_text(source)
          print(f"Normalized legacy Android/Kotlin plugin configuration in {gradle_file}")
          PY
      - name: Patch EPUB parser for current image package API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          candidates = list(cache.glob("hosted/pub.dev/epubx-*/lib/src/readers/book_cover_reader.dart"))
          candidates += list(cache.glob("hosted/pub.dartlang.org/epubx-*/lib/src/readers/book_cover_reader.dart"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one resolved epubx cover reader, found {len(candidates)}")
          source_file = candidates[0]
          source = source_file.read_text()
          old = "images.decodeImage(coverImageContent)"
          new = "images.decodeImage(Uint8List.fromList(coverImageContent))"
          if old in source:
              source = source.replace(old, new)
              if "import 'dart:typed_data';" not in source:
                  source = "import 'dart:typed_data';\n" + source
              source_file.write_text(source)
              print(f"Patched image byte type compatibility in {source_file}")
          elif new in source:
              print("EPUB image byte compatibility patch is already present.")
          else:
              raise SystemExit("Could not find expected epubx cover image decode call")
          PY
      - name: Align printing plugin with host Android Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          candidates = list(cache.glob("hosted/pub.dev/printing-*/android/build.gradle"))
          candidates += list(cache.glob("hosted/pub.dartlang.org/printing-*/android/build.gradle"))
          if not candidates:
              raise SystemExit("Could not locate the resolved printing Android Gradle file")
          for gradle_file in candidates:
              source = gradle_file.read_text()
              updated, count = re.subn(r"\nbuildscript\s*\{.*?\n\}\s*\n", "\n", source, count=1, flags=re.DOTALL)
              if count:
                  gradle_file.write_text(updated)
                  print(f"Removed legacy plugin AGP classpath from {gradle_file}")
              else:
                  print(f"No legacy buildscript block found in {gradle_file}")
          PY
      - name: Run Flutter static analysis
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
      - name: Run tests individually with timeouts and clear progress logs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find test -name '*_test.dart' -type f | sort)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No Flutter test files found."
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "::group::TEST START: ${test_file}"
            echo "Running ${test_file} with per-test timeout 2m and file timeout 5m."
            timeout --signal=TERM --kill-after=30s 5m flutter test --timeout=2m "${test_file}"
            echo "TEST PASS: ${test_file}"
            echo "::endgroup::"
          done
      - name: Build APK with increasing version code
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: flutter build apk --release --no-tree-shake-icons --build-number "$GITHUB_RUN_NUMBER" --dart-define=YOUTUBE_API_KEY="$YOUTUBE_API_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
