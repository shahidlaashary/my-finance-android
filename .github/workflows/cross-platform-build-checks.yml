name: Cross-platform Build Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --platforms=windows .
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --no-tree-shake-icons

  apple:
    name: iOS and macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Apple runners
        run: flutter create --platforms=ios,macos .
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Build macOS
        run: flutter build macos --release
