name: Build My Finance APK
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create . --platforms=android
      - name: Configure Android activity for biometric authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          activities = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if not activities:
              raise SystemExit("Generated MainActivity.kt was not found")
          activity = activities[0]
          content = activity.read_text()
          content = content.replace(
              "import io.flutter.embedding.android.FlutterActivity",
              "import io.flutter.embedding.android.FlutterFragmentActivity",
          )
          content = re.sub(r":\\s*FlutterActivity\\s*\\(", ": FlutterFragmentActivity(", content)
          if "FlutterFragmentActivity" not in content:
              raise SystemExit("Could not configure FlutterFragmentActivity for local_auth")
          activity.write_text(content)
          PY
      - name: Enable Android internet access for online exchange rates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permission + "    <application", 1)
              manifest.write_text(content)
          PY
      - name: Configure Gradle download
        run: |
          sed -i 's#services.gradle.org/distributions/#downloads.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
