
name: my_finance
description: My Finance - Personal Finance Management App
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_functions: ^5.6.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  url_launcher: ^6.3.2

  # Local Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7

  # File and Path Management
  path: ^1.9.1
  path_provider: ^2.1.5

  # Date and Currency Formatting
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2

  # Images and Attachments
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  open_filex: ^5.0.0
  audioplayers: ^6.5.0
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6
  image: ^4.11.1
  youtube_player_iframe: ^5.2.1
  pdfx: ^2.9.2
  epub_view: ^3.3.0

  # Backup and Restore
  archive: ^4.0.7

  # PIN-based App Lock
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

dependency_overrides:
  # image 4.11.0 calls decodeLazy, introduced in archive 4.4.0.
  archive: 4.4.0
  image: 4.11.1
  # flutter_html 3.0.0 still calls the matches() API removed in html 0.15.7.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/global_card_catalog.json
    - assets/data/card_verification_report.json
  fonts:
    - family: JameelNooriNastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq.ttf
