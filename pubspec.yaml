
name: my_finance
description: My Finance - Personal Finance Management App
publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

  # Local Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7
  sqlite3: ^2.9.4

  # File and Path Management
  path: ^1.9.1
  path_provider: ^2.1.5

  # Date and Currency Formatting
  intl: ^0.20.2

  # Images and Attachments
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  open_filex: ^5.0.0

  # Backup and Restore
  archive: ^4.0.7

  # PIN-based App Lock
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
