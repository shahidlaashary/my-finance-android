name: PR Flutter Tests and APK

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Patch EPUB parser for current image package API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          candidates = list(cache.glob("hosted/pub.dev/epubx-*/lib/src/readers/book_cover_reader.dart"))
          candidates += list(cache.glob("hosted/pub.dartlang.org/epubx-*/lib/src/readers/book_cover_reader.dart"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one resolved epubx cover reader, found {len(candidates)}")
          source_file = candidates[0]
          source = source_file.read_text()
          old = "images.decodeImage(coverImageContent)"
          new = "images.decodeImage(Uint8List.fromList(coverImageContent))"
          if old in source:
              source = source.replace(old, new)
              if "import 'dart:typed_data';" not in source:
                  source = "import 'dart:typed_data';\n" + source
              source_file.write_text(source)
              print(f"Patched image byte type compatibility in {source_file}")
          elif new in source:
              print("EPUB image byte compatibility patch is already present.")
          else:
              raise SystemExit("Could not find expected epubx cover image decode call")
          PY
      - name: Configure temporary Android test signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          secret_count=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then secret_count=$((secret_count + 1)); fi
          done
          if [ "$secret_count" -eq 4 ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            test -s android/app/upload-keystore.jks
            {
              echo "ANDROID_KEYSTORE_PATH=upload-keystore.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ "$secret_count" -eq 0 ]; then
            temp_password="$(openssl rand -hex 24)"
            keytool -genkeypair -v -keystore android/app/temporary-test-signing.jks -storepass "$temp_password" -keypass "$temp_password" -alias myfinance-temporary -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=My Finance Temporary Test, OU=Development, O=My Finance, L=Unknown, ST=Unknown, C=PK"
            {
              echo "ANDROID_KEYSTORE_PATH=temporary-test-signing.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$temp_password"
              echo "ANDROID_KEY_ALIAS=myfinance-temporary"
              echo "ANDROID_KEY_PASSWORD=$temp_password"
            } >> "$GITHUB_ENV"
          else
            echo "Incomplete Android signing secrets; configure all four or remove all four for temporary test signing."
            exit 1
          fi
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-PR-Verification-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
