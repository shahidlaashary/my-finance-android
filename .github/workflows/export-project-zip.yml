
name: Export My Finance ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          mkdir -p dist

          zip -r dist/My-Finance-Project.zip . \
            -x ".git/*" \
               "*/.git/*" \
               "dist/*" \
               ".dart_tool/*" \
               "*/.dart_tool/*" \
               "build/*" \
               "*/build/*" \
               ".idea/*" \
               ".DS_Store"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: My-Finance-Project
          path: dist/My-Finance-Project.zip
          if-no-files-found: error
          retention-days: 30
