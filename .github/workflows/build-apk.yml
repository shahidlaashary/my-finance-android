name: Build My Finance APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'my_finance_flutter_v1_2(2).zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter project
        run: |
          unzip "my_finance_flutter_v1_2(2).zip" -d extracted
          cp -r extracted/my_finance_flutter_v1_2/. .
          flutter create . --platforms=android      - name: Set Android compile SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: My-Finance-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
